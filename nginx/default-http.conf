# nginx-Konfig für Tailscale-Serve-Setup: kein TLS in nginx, kein
# HTTP→HTTPS-Redirect — Tailscale terminiert HTTPS davor und proxied
# Plain-HTTP zu uns. Reverse-Proxy + statische PWA bleiben unverändert.
server {
    listen 80 default_server;
    server_name _;

    # PWA static files
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://parley:7800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for streaming sessions (up to 30 min recordings)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://parley:7800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large audio uploads
        client_max_body_size 50m;

        # Timeout for transcription
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # PWA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: revalidate on every request (fast if unchanged, fresh if updated)
    location ~* \.(js|css|json|svg|png|ico)$ {
        add_header Cache-Control "no-cache";
    }
}
